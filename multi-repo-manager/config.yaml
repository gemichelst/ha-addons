name: "Multi Repo Manager"
version: "1.0.0"
slug: "multi_repo_manager"
description: "Manage multiple Home Assistant add-on repository URLs from a single clean web UI."
url: "https://github.com/gemichelst/ha-addons/tree/main/multi-repo-manager"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:folder-multiple-outline
panel_title: "Repo Manager"
hassio_api: false
homeassistant_api: false
map:
  - type: addon_config
    read_only: false
apparmor: true
stage: stable
options:
  repositories: []
schema:
  repositories:
    - name: str
      url: url
      description: "str?"
      enabled: "bool?"
